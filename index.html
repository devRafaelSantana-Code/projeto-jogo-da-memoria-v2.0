<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Jogo da memória - jQuery & Bootstrap</title>

      <link
         href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
         rel="stylesheet"
         integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
         crossorigin="anonymous"
      />

      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Righteous&display=swap"
         rel="stylesheet"
      />

      <link rel="stylesheet" href="./assets/styles/style.css" />
   </head>
   <body>
      <div
         id="appContainer"
         class="d-flex flex-column justify-content-between align-items-center w-100 vh-100 overflow-hidden text-center text-white select-none"
      >
         <div class="w-100 flex-shrink-0 mt-4 mt-md-5 px-3">
            <h1
               class="font-righteous tracking-wide mb-2 mb-md-3 display-5 drop-shadow"
            >
               Jogo da memória
            </h1>

            <div
               class="d-inline-flex gap-4 px-4 py-2 bg-black bg-opacity-25 rounded-pill shadow-sm border border-white border-opacity-10"
            >
               <span class="fs-6 fs-md-5">
                  Movimentos:
                  <span id="movesCount" class="fw-bold text-success">0</span>
               </span>
               <div class="vr opacity-25"></div>
               <span class="fs-6 fs-md-5">
                  Tempo:
                  <span id="timeCount" class="fw-bold text-info">00:00</span>
               </span>
            </div>
         </div>

         <div
            class="w-100 flex-grow-1 d-flex align-items-center justify-content-center p-3 overflow-hidden min-h-0"
         >
            <div
               id="gameBoard"
               class="row row-cols-4 g-2 g-md-3 w-100 justify-content-center align-items-center m-0"
            ></div>
         </div>

         <div
            class="modal fade"
            id="gameOverModal"
            data-bs-backdrop="static"
            data-bs-keyboard="false"
            tabindex="-1"
            aria-hidden="true"
         >
            <div class="modal-dialog modal-dialog-centered">
               <div
                  class="modal-content bg-dark text-white border-secondary rounded-4 shadow-lg"
               >
                  <div class="modal-body p-4 p-md-5 text-center">
                     <h2 class="font-righteous mb-3 text-white">
                        Parabéns, você completou o jogo!
                     </h2>
                     <div class="my-4 fs-5 text-white-50">
                        <p class="mb-1">
                           Precisou de
                           <span id="modalMoves" class="text-success fw-bold"
                              >0</span
                           >
                           movimentos
                        </p>
                        <p class="mb-0">
                           Tempo total:
                           <span id="modalTime" class="text-info fw-bold"
                              >00:00</span
                           >
                        </p>
                     </div>
                     <button
                        id="restartBtn"
                        class="btn btn-lg rounded-pill px-4 py-2 font-righteous text-white shadow shadow-hover border-0"
                     >
                        Jogar novamente
                     </button>
                  </div>
               </div>
            </div>
         </div>

         <footer>Criado por Dev. Rafael Santana</footer>
      </div>

      <script
         src="https://code.jquery.com/jquery-4.0.0.js"
         integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
         crossorigin="anonymous"
      ></script>

      <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
         crossorigin="anonymous"
      ></script>

      <script src="./assets/scripts/game.js"></script>
      <script src="./assets/scripts/script.js"></script>
   </body>
</html>
